name: Build TWRP
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Sync TWRP source
        run: |
          mkdir ~/twrp && cd ~/twrp
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          ~/bin/repo sync -c -j8 --force-sync --no-clone-bundle --no-tags

      - name: Copy device tree
        run: |
          D=~/twrp/device/infinix/Infinix_X6826
          mkdir -p $D
          SRC=$(dirname "$(find $GITHUB_WORKSPACE/device_tree -type f -name BoardConfig.mk | head -n1)")
          echo "Device tree found at: $SRC"
          if [ ! -f "$SRC/BoardConfig.mk" ]; then
            echo "ERROR: BoardConfig.mk not found"
            exit 1
          fi
          cp -r "$SRC"/. $D/
          mkdir -p $D/prebuilt
          [ -f $D/kernel ] && mv $D/kernel $D/prebuilt/kernel
          [ -f $D/dtb.img ] && mv $D/dtb.img $D/prebuilt/dtb.img
          if [ ! -f $D/prebuilt/kernel ] || [ ! -f $D/prebuilt/dtb.img ]; then
            echo "ERROR: kernel or dtb.img missing"
            ls -R $D
            exit 1
          fi
          # replace hyphen with underscore so lunch can parse the name
          grep -rIl "Infinix-X6826" $D | xargs sed -i '/BUILD_FINGERPRINT/!s/Infinix-X6826/Infinix_X6826/g'
          mv $D/omni_Infinix-X6826.mk $D/omni_Infinix_X6826.mk
          ls -la $D $D/prebuilt
          cat $D/AndroidProducts.mk

      - name: Build
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_Infinix_X6826-eng
          mka bootimage

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-boot
          path: /home/runner/twrp/out/target/product/Infinix_X6826/boot.img
